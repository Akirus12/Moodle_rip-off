{% extends "base.html" %}
{% block title %}User Administration{% endblock %}

{% block content %}
<section class="panel">
  <h2>Users</h2>

  <table class="data-table">
    <thead>
      <tr>
        <th>Username</th>
        <th>Email</th>
        <th>Role</th>
        <th>Actions</th>
      </tr>
    </thead>
    <tbody>
      {% for user in users %}
      <tr>
        <td>{{ user.username }}</td>
        <td>{{ user.email }}</td>
        <td>{{ user.get_role_display }}</td>
        <td>
          <a href="{% url 'administrating:user_detail' user.pk %}">View</a>
          |
          <a href="{% url 'administrating:user_delete' user.pk %}">Delete</a>
        </td>
      </tr>
      {% endfor %}
    </tbody>
  </table>
</section>
{% endblock %}

{% extends "base.html" %}
{% block title %}Delete User{% endblock %}

{% block content %}
<section class="panel">
  <h2>Delete user "{{ target_user.username }}"?</h2>

  <form method="post">
    {% csrf_token %}
    <button type="submit" class="btn btn-danger">Confirm delete</button>
    <a href="{% url 'administrating:user_list' %}">Cancel</a>
  </form>
</section>
{% endblock %}

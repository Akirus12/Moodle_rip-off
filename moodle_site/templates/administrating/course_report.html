{% extends "base.html" %}
{% block title %}Course Report{% endblock %}

{% block content %}
<h2>Course Enrollment / Material Report</h2>

<table class="data-table">
  <thead>
    <tr>
      <th>Course</th>
      <th>Materials</th>
    </tr>
  </thead>
  <tbody>
    {% for row in report %}
    <tr>
      <td>{{ row.title }}</td>
      <td>{{ row.materials_count }}</td>
    </tr>
    {% endfor %}
  </tbody>
</table>
{% endblock %}
